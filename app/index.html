<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="description" content="行测真题 · 考试与练习" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>行测真题</title>
    <script>
      (function () {
        function show(message) {
          var el = document.getElementById('boot-error');
          if (!el) {
            el = document.createElement('pre');
            el.id = 'boot-error';
            el.style.cssText =
              'position:fixed;inset:0;z-index:9999;margin:0;padding:20px;overflow:auto;background:#fff;color:#b91c1c;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap';
            document.body.appendChild(el);
          }
          el.textContent += String(message) + '\n';
        }
        window.addEventListener('error', function (e) {
          show('启动失败：' + (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('启动失败（Promise）：' + (r && (r.stack || r.message) ? r.stack || r.message : r));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
